name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build, deterministic tests & native GUI E2E
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and deterministic test suites
        shell: pwsh
        run: .\build.ps1 -JarOnly

      - name: Setup pinned mpv for native GUI E2E
        shell: pwsh
        run: .\setup-mpv.ps1

      - name: Set desktop resolution for multi-viewport GUI verification
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "Initial desktop: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          try {
            Add-Type @"
            using System;
            using System.Runtime.InteropServices;
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
                [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
                public string dmDeviceName;
                public short dmSpecVersion;
                public short dmDriverVersion;
                public short dmSize;
                public short dmDriverExtra;
                public int dmFields;
                public int dmPositionX;
                public int dmPositionY;
                public int dmDisplayOrientation;
                public int dmDisplayFixedOutput;
                public short dmColor;
                public short dmDuplex;
                public short dmYResolution;
                public short dmTTOption;
                public short dmCollate;
                [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
                public string dmFormName;
                public short dmLogPixels;
                public int dmBitsPerPel;
                public int dmPelsWidth;
                public int dmPelsHeight;
                public int dmDisplayFlags;
                public int dmDisplayFrequency;
                public int dmICMMethod;
                public int dmICMIntent;
                public int dmMediaType;
                public int dmDitherType;
                public int dmReserved1;
                public int dmReserved2;
                public int dmPanningWidth;
                public int dmPanningHeight;
            }
            public class DisplaySettingsHelper {
                [DllImport("user32.dll", CharSet = CharSet.Ansi)]
                public static extern int EnumDisplaySettings(string lpszDeviceName, int iModeNum, ref DEVMODE lpDevMode);
                [DllImport("user32.dll", CharSet = CharSet.Ansi)]
                public static extern int ChangeDisplaySettings(ref DEVMODE lpDevMode, int dwFlags);
                public const int ENUM_CURRENT_SETTINGS = -1;
                public const int DM_PELSWIDTH = 0x00080000;
                public const int DM_PELSHEIGHT = 0x00100000;
                public static int SetResolution(int width, int height) {
                    DEVMODE dm = new DEVMODE();
                    dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                    if (EnumDisplaySettings(null, ENUM_CURRENT_SETTINGS, ref dm) != 0) {
                        dm.dmPelsWidth = width;
                        dm.dmPelsHeight = height;
                        dm.dmFields = DM_PELSWIDTH | DM_PELSHEIGHT;
                        int test = ChangeDisplaySettings(ref dm, 0x02);
                        if (test == 0) {
                            return ChangeDisplaySettings(ref dm, 0x01);
                        }
                        return ChangeDisplaySettings(ref dm, 0);
                    }
                    return -1;
                }
            }
"@
            $res = [DisplaySettingsHelper]::SetResolution(1920, 1080)
            Write-Host "ChangeDisplaySettings 1920x1080 result: $res"
          } catch {
            Write-Host "ChangeDisplaySettings notice: $_"
          }
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force
          }
          Write-Host "Available desktop: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - name: Run native Windows GUI E2E with populated fixture catalog
        shell: pwsh
        run: .\build.ps1 -RunGuiE2E

      - name: Verify native GUI E2E verdict and multi-viewport screenshots
        shell: pwsh
        run: |
          if (-not (Test-Path "build\windows-gui-e2e\manifest.json")) {
            throw "GUI E2E manifest not found at build\windows-gui-e2e\manifest.json"
          }
          $manifest = Get-Content "build\windows-gui-e2e\manifest.json" | ConvertFrom-Json
          if ($manifest.verdict -ne "PASS") {
            throw "GUI E2E verdict was $($manifest.verdict), expected PASS"
          }
          if ($manifest.screenshotsCount -lt 8) {
            throw "Expected at least 8 visual screenshot artifacts, found $($manifest.screenshotsCount)"
          }
          Write-Host "Native Windows GUI E2E verified: $($manifest.screenshotsCount) screenshots adhering to anti-slop standards."

      - name: Upload native Windows GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-gui-screenshots-${{ github.sha }}
          path: build/windows-gui-e2e/screenshots/*.png
          if-no-files-found: warn

      - name: Upload native Windows GUI E2E execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-gui-report-${{ github.sha }}
          path: |
            build/windows-gui-e2e/manifest.json
            build/windows-gui-e2e/results.txt
          if-no-files-found: warn

      - name: Upload Streamflix Desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-desktop-jar-${{ github.sha }}
          path: build/streamflix-desktop.jar

  linux:
    name: Linux compile, deterministic tests & headless E2E verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and deterministic tests
        shell: bash
        run: bash ./build.sh

      - name: Headless E2E verification
        shell: bash
        run: bash ./build.sh --gui-e2e

      - name: Verify headless E2E execution report
        shell: bash
        run: |
          if [[ ! -f "build/gui-e2e/manifest.json" ]]; then
            echo "GUI E2E manifest not found at build/gui-e2e/manifest.json" >&2
            exit 1
          fi
          echo "Headless E2E report verified successfully."

      - name: Upload Linux E2E execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gui-report-${{ github.sha }}
          path: |
            build/gui-e2e/manifest.json
            build/gui-e2e/results.txt
            build/gui-e2e/screenshots/*.png
          if-no-files-found: ignore
